[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "text2sql"
version = "0.2.0"
description = "A small local text-to-SQL agent with Ollama, LangChain and PostgreSQL"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{name = "text2sql contributors"}]
dependencies = [
  "fastapi>=0.115,<1",
  "langchain-core>=1,<2",
  "langchain-ollama>=1,<2",
  "numpy>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "sqlglot>=26,<31",
  "uvicorn>=0.34,<1",
]

[project.scripts]
text2sql-eval = "text2sql.evaluation:main"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
# Keep the lockfile's seven-day release cooldown consistent locally and in CI.
exclude-newer = "7 days"

[tool.hatch.build.targets.wheel]
packages = ["src/text2sql"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/text2sql/*.py", "/src/text2sql/*.json", "/tests/*.py",
  "/examples/*.py", "/scripts/*.sql", "/evals/*.json", "/evals/README.md",
  "/docs/design.md", "/docs/README.md",
  "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock",
  "/compose.yaml", "/.env.example", "/.python-version", "/.github/workflows/*.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: requires the demonstration PostgreSQL (TEXT2SQL_TEST_DATABASE_URL)"]
